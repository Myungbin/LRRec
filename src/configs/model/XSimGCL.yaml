# XSimGCL (Yu et al., TKDE'23) -- ID-based baseline, see models/xsimgcl.py
is_lr_model: False       # ID embeddings only; item LRs are not loaded
neg_sample_num: 1        # BPR
train_sampling: user
learning_rate: 0.001
train_batch_size: 2048

n_layers: 3
layer_cl: 1              # layer contrasted with the final representation (1-indexed)
eps: 0.1                 # magnitude of the signed uniform noise
lambda_cl: 0.2           # contrastive loss weight
tau_cl: 0.2              # contrastive temperature
reg_weight: 0.0001

# best on validation Recall@20 in scripts/tune_baselines.py --name tune2026 (paper ranges, seed 2026, file split)
dataset_params:
  amazon_movie:     {n_layers: 5, layer_cl: 1, lambda_cl: 0.1,  eps: 0.1}
  amazon_book_2014: {n_layers: 5, layer_cl: 1, lambda_cl: 0.1,  eps: 0.05}
  amazon_video:     {n_layers: 5, layer_cl: 5, lambda_cl: 0.01, eps: 0.01}

hyper_parameters: []
