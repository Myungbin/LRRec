# LightGCN (He et al., SIGIR'20) -- ID-based baseline, see models/lightgcn.py
is_lr_model: False       # ID embeddings only; item LRs are not loaded
neg_sample_num: 1        # BPR
train_sampling: user
learning_rate: 0.001
train_batch_size: 2048
epochs: 1000             # "Typically, 1000 epochs are sufficient for LightGCN to converge" (paper Sec. 4.1.2)

n_layers: 3
reg_weight: 0.0001       # L2 on the batch's layer-0 embeddings

# best on validation Recall@20 in the AlphaFree repo sweep (n_layers 1-5 x reg {1e-5,1e-4,1e-3}, seed 2026;
# experiments/LightGCN/2026-09-23_movie-video-tuning.md)
dataset_params:
  amazon_movie: {n_layers: 3, reg_weight: 0.001}
  amazon_video: {n_layers: 4, reg_weight: 0.001}

hyper_parameters: []
